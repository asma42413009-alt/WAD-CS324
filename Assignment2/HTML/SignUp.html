/* By Asma Waseem*/
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="icon" href="../images/o.png" type="image/png">
    <link rel="stylesheet" href="../CSS/style1.css">
    <link rel="stylesheet" href="../CSS/Colouring.css">
</head>
<body>

    <div class="Outer-Box">
    <div class="crossModify">
    <a href="index.html"><img src="../images/cross.png" alt="cross-Image"/></a>
    </div>
    <form method="get" class="FormModify">
        <fieldset>
            <legend>
                <div class="LegendElements">
                <img src="../images/profile.png" alt="CreateAccount-Image">
                <h1 id="textColorBody">Create Your Account</h1>
                <p id="textColorBody">Join us to keep your purchase safe and organized</p>
                </div>
            </legend>
            
            <div class="input-box">
                <img src="../images/FullName.png" alt="Profile-Image" >
                <input type="text" name="Name" placeholder="Full Name">
            </div>
            
            <div class="input-box">
                <img src="../images/email.png" alt="Mail-Image">
                <input type="email" name="Email" placeholder="Email"/>
            </div>
            
            <div class="input-box">
                <img src="../images/security.png" alt="Lock-Image">
                <input type="password" name="Password" placeholder="Password"/>
            </div>
            
            <div class="input-box">
                <img src="../images/security.png" alt="LockAgain-Image">
                <input type="password" name="Confirm-Password" placeholder="Confirm Password"/>
            </div>
            
            <div class="SgnUpBtn">
                <button type="submit"><a href="Login.html" id="textColorBody">SignUp</a></button>
            </div>

            <div class="LoginPart">
                <p id="textColorBody">Already have an account?</p>
                <a href="Login.html" id="textColorBody">Login</a>
            </div>
        </fieldset>
    </form>
    </div>
</body>
</html>
