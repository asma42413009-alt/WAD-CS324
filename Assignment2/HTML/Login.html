<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" href="../images/o.png" type="image/png">
    <link rel="stylesheet" href="../CSS/style1.css">
    <link rel="stylesheet" href="../CSS/Colouring.css">
</head>
</head>
<body>

    <div class="Outer-Box">
    <div class="crossModify">
    <a href="index.html"><img src="../images/cross.png" alt="cross-Image"/></a>
    </div>
    <form method="get" class="FormModify">
        <fieldset>
            <legend>
                <div class="LegendElements">
                <img src="../images/profile.png" alt="CreateAccount-Image">
                <h1 id="textColorBody">Login</h1>
                <p id="textColorBody">Welcome back! Please login to your account</p>
                </div>
            </legend>
            
            <div class="input-box">
                <img src="../images/email.png" alt="Mail-Image">
                <input type="email" name="Email" placeholder="Email"/>
            </div>
            
            <div class="input-box">
                <img src="../images/security.png" alt="Lock-Image">
                <input type="password" name="Password" placeholder="Password"/>
            </div>
            
             <div class="Forget">
                <input type="checkbox" name="Remember-Me">
                <label id="textColorBody">Remember Me</label>
                <a href="#" id="textColorBody">Forget Password?</a>
            </div>

            <div class="SgnUpBtn">
                <button type="submit"><a href="dashboard.html" id="textColorBody">Login</a></button>
            </div>

        </fieldset>
    </form>
    </div>
</body>
</html>
